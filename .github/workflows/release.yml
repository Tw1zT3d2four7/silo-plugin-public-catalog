name: Build and publish plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PLUGIN_NAME: silo-plugin-public-catalog
  MANIFEST_PATH: cmd/silo-plugin-public-catalog/manifest.json
  IMAGE_NAME: ghcr.io/tw1zt3d2four7/silo-plugin-public-catalog

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build Linux amd64 plugin
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          make build
          file "$PLUGIN_NAME"
          sha256sum "$PLUGIN_NAME" | tee "$PLUGIN_NAME.sha256"

      - name: Prepare release assets
        run: |
          cp "$MANIFEST_PATH" manifest.json
          checksum="$(sha256sum "$PLUGIN_NAME" | awk '{print $1}')"
          jq --arg checksum "$checksum" '.checksum = $checksum' "$MANIFEST_PATH" > manifest.json
          tar -czf "$PLUGIN_NAME-linux-amd64.tar.gz" "$PLUGIN_NAME" manifest.json "$PLUGIN_NAME.sha256"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/package.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/tw1zt3d2four7/silo-plugin-public-catalog:latest
            ghcr.io/tw1zt3d2four7/silo-plugin-public-catalog:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tw1zT3d2four7/silo-plugin-public-catalog
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: Latest plugin build
          body: Automated Linux amd64 build for the current main branch.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            ${{ env.PLUGIN_NAME }}
            ${{ env.PLUGIN_NAME }}.sha256
            ${{ env.PLUGIN_NAME }}-linux-amd64.tar.gz
            manifest.json

      - name: Publish catalog metadata to this repository
        if: github.ref == 'refs/heads/main'
        run: |
          checksum="$(sha256sum "$PLUGIN_NAME" | awk '{print $1}')"
          jq --arg checksum "$checksum" '.checksum = $checksum' "$MANIFEST_PATH" > manifest.json
          jq -n --slurpfile manifest manifest.json \
            --arg binary_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/plugin-latest/${PLUGIN_NAME}" \
            --arg checksum "$checksum" \
            '{plugins: [{manifest: $manifest[0], binaries: {"linux/amd64": {url: $binary_url, checksum: $checksum}}}]}' \
            > catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "Catalog metadata is unchanged."
          else
            git commit -m "chore: update plugin catalog [skip ci]"
            git push origin HEAD:main
          fi
